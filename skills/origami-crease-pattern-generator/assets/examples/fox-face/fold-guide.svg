<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 794 1123">
<defs><marker id="arrow" viewBox="0 0 8 8" markerWidth="5" markerHeight="5" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#265b53"/></marker></defs>
<rect width="794" height="1123" fill="#f6f5f0"/>
<g fill="#252f2d" font-family="Hiragino Sans, Yu Gothic, Meiryo, Noto Sans CJK JP, sans-serif">
<text x="34" y="58" font-size="32" font-weight="bold">正面を向いたキツネの顔</text>
<text x="35" y="92" font-size="16" >正方形1枚　／　設計 ruff　／　色と白の両面紙を使います。</text>
<g transform="translate(34,124)"><rect width="354" height="394" rx="10" fill="#fffdfa" stroke="#d4d4c8"/><text x="16" y="32" font-size="19" font-weight="bold">1　色を内側にして半分に折る</text><polygon points="84.00,156.00 177.00,63.00 270.00,156.00 177.00,249.00" fill="#df945e" stroke="#574c44" stroke-width="1.5" stroke-linejoin="round"/><path d="M84.00,156.00 L270.00,156.00" fill="none" stroke="#146aa1" stroke-width="2" stroke-dasharray="7 4"/><path d="M178.86,243.42 Q242.10,165.30 182.58,72.30" fill="none" stroke="#265b53" stroke-width="2.5" marker-end="url(#arrow)"/><circle cx="177.00" cy="63.00" r="2.7" fill="#403c37"/><text x="184" y="60" font-size="13" font-weight="bold">B</text><circle cx="177.00" cy="249.00" r="2.7" fill="#403c37"/><text x="184" y="258" font-size="13" font-weight="bold">D</text><circle cx="84.00" cy="156.00" r="2.7" fill="#403c37"/><text x="69" y="160" font-size="13" font-weight="bold">A</text><circle cx="270.00" cy="156.00" r="2.7" fill="#403c37"/><text x="276" y="160" font-size="13" font-weight="bold">C</text><text x="16" y="290" font-size="15" >色の面を上にして、紙をひし形に置く。</text><text x="16" y="313" font-size="15" >下の角 D を上の角 B に重ねて谷折りする。</text><text x="16" y="336" font-size="15" >長い辺が下、二枚の自由な角が上に来る。</text><text x="16" y="359" font-size="15" >この底辺の谷折りは、後で山に返す。</text></g>
<g transform="translate(406,124)"><rect width="354" height="394" rx="10" fill="#fffdfa" stroke="#d4d4c8"/><text x="16" y="32" font-size="19" font-weight="bold">2　耳の根元に折り筋をつける</text><polygon points="65.00,231.00 177.00,119.00 289.00,231.00" fill="#fff1d6" stroke="#574c44" stroke-width="1.5" stroke-linejoin="round"/><path d="M177.00,231.00 L177.00,119.00" fill="none" stroke="#858681" stroke-width="2" stroke-dasharray="2 4"/><path d="M177.00,231.00 L113.91,182.09" fill="none" stroke="#146aa1" stroke-width="2" stroke-dasharray="7 4"/><path d="M177.00,231.00 L240.09,182.09" fill="none" stroke="#146aa1" stroke-width="2" stroke-dasharray="7 4"/><circle cx="177.00" cy="231.00" r="2.7" fill="#403c37"/><text x="173" y="247" font-size="13" font-weight="bold">O</text><circle cx="240.09" cy="182.09" r="2.7" fill="#403c37"/><text x="247.09" y="179.09" font-size="13" font-weight="bold">Q</text><text x="16" y="290" font-size="15" >底辺の中点 O が鼻先になる。</text><text x="16" y="313" font-size="15" >左右の角から頂点へ、各斜辺の 43.7% の</text><text x="16" y="336" font-size="15" >位置に Q をとる。二枚重ねで O–Q に</text><text x="16" y="359" font-size="15" >折り筋をつけて戻す。反対側も同様。</text></g>
<g transform="translate(34,538)"><rect width="354" height="394" rx="10" fill="#fffdfa" stroke="#d4d4c8"/><text x="16" y="32" font-size="19" font-weight="bold">3　左右の角を返して耳を立てる</text><polygon points="177.00,230.00 113.91,181.09 149.08,121.54" fill="#df945e" stroke="#574c44" stroke-width="1.5" stroke-linejoin="round"/><polygon points="177.00,230.00 240.09,181.09 204.92,121.54" fill="#df945e" stroke="#574c44" stroke-width="1.5" stroke-linejoin="round"/><polygon points="177.00,230.00 113.91,181.09 177.00,118.00 240.09,181.09" fill="#fff1d6" stroke="#574c44" stroke-width="1.5" stroke-linejoin="round"/><path d="M177.00,230.00 L240.09,181.09" fill="none" stroke="#858681" stroke-width="2" stroke-dasharray="2 4"/><path d="M177.00,230.00 L113.91,181.09" fill="none" stroke="#858681" stroke-width="2" stroke-dasharray="2 4"/><path d="M287.88,227.76 Q294.60,152.72 208.84,119.86" fill="none" stroke="#265b53" stroke-width="2.5" marker-end="url(#arrow)"/><circle cx="177.00" cy="230.00" r="2.7" fill="#403c37"/><text x="173" y="246" font-size="13" font-weight="bold">O</text><circle cx="240.09" cy="181.09" r="2.7" fill="#403c37"/><text x="247.09" y="178.09" font-size="13" font-weight="bold">Q</text><text x="16" y="290" font-size="15" >底辺の右端を開き、O–Q の二本の筋を</text><text x="16" y="313" font-size="15" >色の面から見て谷にする。O と右端を結ぶ</text><text x="16" y="336" font-size="15" >筋を山に返し、先端を上に向けて閉じる。</text><text x="16" y="359" font-size="15" >左端も同じ。O は下端のまま動かさない。</text></g>
<g transform="translate(406,538)"><rect width="354" height="394" rx="10" fill="#fffdfa" stroke="#d4d4c8"/><text x="16" y="32" font-size="19" font-weight="bold">4　額の二枚を表と裏に返す</text><polygon points="177.00,230.00 113.91,181.09 149.08,121.54" fill="#df945e" stroke="#574c44" stroke-width="1.5" stroke-linejoin="round"/><polygon points="177.00,230.00 240.09,181.09 204.92,121.54" fill="#df945e" stroke="#574c44" stroke-width="1.5" stroke-linejoin="round"/><polygon points="177.00,230.00 113.91,181.09 134.44,160.56 219.56,160.56 240.09,181.09" fill="#fff1d6" stroke="#574c44" stroke-width="1.5" stroke-linejoin="round"/><polygon points="134.44,160.56 219.56,160.56 177.00,203.12" fill="#df945e" stroke="#574c44" stroke-width="1.5" stroke-linejoin="round"/><path d="M134.44,160.56 L219.56,160.56" fill="none" stroke="#146aa1" stroke-width="2" stroke-dasharray="7 4"/><path d="M181.48,120.24 Q218.44,154.96 182.60,203.12" fill="none" stroke="#265b53" stroke-width="2.5" marker-end="url(#arrow)"/><circle cx="177.00" cy="230.00" r="2.7" fill="#403c37"/><text x="173" y="246" font-size="13" font-weight="bold">O</text><text x="16" y="290" font-size="15" >O から三角形の高さの 62.0% 上に、</text><text x="16" y="313" font-size="15" >底辺と平行な折り線をとる。上の二枚を</text><text x="16" y="336" font-size="15" >分け、手前の一枚は手前へ、奥の一枚は</text><text x="16" y="359" font-size="15" >背面へ折り下げる。両耳の先を自由に保つ。</text></g>
<text x="34" y="980" font-size="19" font-weight="bold">折り筋の見方</text>
<path d="M36 1012 h68" stroke="#813d3b" stroke-width="2" stroke-dasharray="11 3 2 3"/>
<text x="112" y="1018" font-size="16" >山折り</text>
<path d="M210 1012 h68" stroke="#146aa1" stroke-width="2" stroke-dasharray="7 4"/>
<text x="286" y="1018" font-size="16" >谷折り</text>
<text x="34" y="1062" font-size="15" >展開図上の角は、左上から時計回りに A・B・C・D。図1は紙を回転した向き。</text>
<text x="34" y="1091" font-size="15" >長さは割合で示しています。折った後は、正面から両耳・額・鼻先の見え方を確かめます。</text>
</g></svg>
